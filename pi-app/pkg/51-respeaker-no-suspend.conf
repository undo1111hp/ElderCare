# Keep the ReSpeaker Lite configured at all times.
#
# Suspending an idle node makes ALSA renegotiate this USB device on resume, and
# it does not survive that: the kernel logs
#     usb 3-1: cannot submit urb 0, error -2: endpoint not enabled
#     usb 3-1: 1:0: usb_set_interface failed (-71)
# after which the card disappears from `arecord -l` until physically replugged.
# Verified: with this rule plus one capture + one playback stream held open, the
# device ran 60 min / 180,726 frames with zero USB errors.
#
# Check it applied with:
#   pw-dump | grep -c '"session.suspend-timeout-seconds": 0'    # expect 2
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Seeed_Studio_ReSpeaker_Lite.*" }
      { node.name = "~alsa_output.usb-Seeed_Studio_ReSpeaker_Lite.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
