# PTalk Signature native — configuration
# Edit and restart the app (or the kiosk service) to apply.

[server]
ws_url = "ws://YOUR_L40S_HOST:8000/device/ws"   # Elder Care /device (thơ RAG + khung chat)
aitools_url = "https://aitools.ptit.edu.vn"
device_id = "pi_eldercare"          # định danh gửi trong handshake (email/username/thiết bị)
firmware_version = "3.0.0"

[audio]
sample_rate = 48000
channels = 1
frame_ms = 20
# ALSA device for mic/loa. "default" = theo thiết bị mặc định của hệ thống.
# Sau khi cắm ReSpeaker Lite, chạy `ptalk-signature --check` để xem tên card
# (arecord -L), rồi ghim ví dụ: "plughw:CARD=Lite".
input_device = "default"
output_device = "default"
opus_bitrate = 24000
# Loa ReSpeaker Lite khuếch đại cố định (không có núm chỉnh âm lượng) → tín hiệu
# to dễ vỡ tiếng ("rè"). output_gain hạ mức + limiter mềm chống méo (0..1).
# Đã kiểm chứng 0.6 nghe rõ nhất. Muốn to hơn thì tăng dần (vd 0.7), nhỏ lại thì giảm.
output_gain = 0.6

[camera]
rotation = 180                       # Camera Module 3 lắp ngược -> 180 (hflip+vflip)

[wakeword]
# Gọi rảnh-tay: nói "Bi ơi" là máy tự nghe (không cần giữ nút). Chạy hoàn toàn
# tại chỗ trên Pi bằng openWakeWord (offline). enabled=false cho tới khi đã nạp
# model /opt/ptalk-signature/models/bi_oi.onnx và cài openwakeword; rồi bật trong
# Cài đặt (hoặc đổi thành true ở đây).
enabled = true
model_path = "/opt/ptalk-signature/models/bi_oi.onnx"
# 0.9 + 2 lần liên tiếp: đo trên tập kiểm thử thì gần như không báo nhầm khi
# trong phòng có người nói chuyện, mà vẫn nghe được ~90% số lần gọi.
# Máy hay tự bật khi không gọi -> tăng threshold (0.93/0.95) hoặc trigger_hits=3.
# Gọi mà máy không nghe -> giảm threshold (0.85) hoặc trigger_hits=1.
threshold = 0.9                      # cao hơn = ít báo nhầm nhưng khó gọi hơn
trigger_hits = 2                     # cần mấy lần liên tiếp mới coi là gọi
refractory_ms = 1800                 # chờ giữa 2 lần đánh thức
silence_ms = 1300                    # im lặng bấy nhiêu ms coi là nói xong -> gửi
lead_ms = 6000                       # gọi xong không nói gì -> huỷ lượt
max_ms = 13000                       # trần thời lượng một lượt nói

[emergency]
number = "115"                       # số gọi khẩn cấp khi bấm nút điện thoại

[ui]
fullscreen = true
font_scale = 1.15                    # người già: chữ to; tăng 1.3–1.5 nếu cần
rotation = 0                         # 0/90/180/270 — nút Xoay cộng dồn 90° mỗi lần
