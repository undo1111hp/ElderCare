# PTalk Signature native — configuration
# Edit and restart the app (or the kiosk service) to apply.

[server]
ws_url = "ws://YOUR_L40S_HOST:8000/device/ws"   # Elder Care /device (thơ RAG + khung chat)
aitools_url = "https://aitools.ptit.edu.vn"
device_id = "pi_eldercare"          # định danh gửi trong handshake (email/username/thiết bị)
firmware_version = "3.0.0"

[audio]
sample_rate = 48000
channels = 1
frame_ms = 20
# ALSA device for mic/loa. "default" = theo thiết bị mặc định của hệ thống.
# Sau khi cắm ReSpeaker Lite, chạy `ptalk-signature --check` để xem tên card
# (arecord -L), rồi ghim ví dụ: "plughw:CARD=Lite".
input_device = "default"
output_device = "default"
opus_bitrate = 24000
# Loa ReSpeaker Lite khuếch đại cố định (không có núm chỉnh âm lượng) → tín hiệu
# to dễ vỡ tiếng ("rè"). output_gain hạ mức + limiter mềm chống méo (0..1).
# Đã kiểm chứng 0.6 nghe rõ nhất. Muốn to hơn thì tăng dần (vd 0.7), nhỏ lại thì giảm.
output_gain = 0.6

[camera]
rotation = 180                       # Camera Module 3 lắp ngược -> 180 (hflip+vflip)

[emergency]
number = "115"                       # số gọi khẩn cấp khi bấm nút điện thoại

[ui]
fullscreen = true
font_scale = 1.15                    # người già: chữ to; tăng 1.3–1.5 nếu cần
rotation = 0                         # 0/90/180/270 — nút Xoay cộng dồn 90° mỗi lần
